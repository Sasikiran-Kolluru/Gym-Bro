<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gym Bros - Workout</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="workout.css" />
</head>
<body>

  <!-- NAV -->
  <header class="navbar">
    <div class="logo">Gym <span>Bros</span></div>

    <div class="nav-links">
      <a href="team.html">Team</a>
      <a href="workout.html" class="active">Workout</a>
    </div>
  </header>

  <!-- BACKGROUND -->
  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- CONTENT -->
  <main class="container">

    <h1>WORKOUT</h1>
    <h3 id="todayWorkoutLabel">Today's Focus: </h3>

    <!-- WORKOUT GRID -->
    <div class="workout-grid" id="workoutGrid">
      <!-- Generated by JS -->
    </div>

    <!-- EXERCISES SECTION -->
    <div class="exercises-section">
      <h3>Exercises</h3>
      <div class="add-exercise-form">
        <input type="text" id="newExerciseName" placeholder="New exercise..." />
        <button onclick="addExercise()">Add</button>
      </div>
      <div id="exerciseList" class="exercise-list">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- ACTIVITY SECTION -->
    <div class="activity-section">
      <h3>Weekly Check-in</h3>
      <div class="weekly-chart" id="weeklyChart">
        <!-- Generated by JS -->
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
