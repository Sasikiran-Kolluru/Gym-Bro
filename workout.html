<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Bros - Workouts</title>
  <link rel="stylesheet" href="workout.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>
  
  <nav class="glass-nav">
    <div class="logo">GYM<span>BROS</span></div>
    <div class="nav-links">
      <a href="team.html">TEAM</a>
      <a href="workout.html" class="active">WORKOUTS</a>
      <a href="index.html" class="logout" onclick="localStorage.removeItem('user')">EXIT</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>THE GRIND</h1>
      <p>Push. Pull. Legs. Repeat.</p>
    </header>

    <div class="weekly-overview glass-panel">
      <h3>WEEKLY CONSISTENCY</h3>
      <div id="weeklyChart" class="chart-container">
        <!-- JS rendered -->
      </div>
    </div>

    <div class="workout-grid-container glass-panel">
      <div id="workoutGrid" class="workout-grid">
        <!-- JS rendered -->
      </div>
    </div>

    <div class="daily-workout glass-panel">
      <h2 id="todayWorkoutLabel">Viewing Day</h2>
      
      <div class="add-exercise">
        <input type="text" id="newExerciseName" placeholder="Add new exercise...">
        <button class="neon-btn-add" onclick="addExercise()">+</button>
      </div>

      <div id="exerciseList" class="exercise-list">
        <!-- JS rendered -->
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
