<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Bros - Team Roster</title>
  <link rel="stylesheet" href="team.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>
  
  <nav class="glass-nav">
    <div class="logo">GYM<span>BROS</span></div>
    <div class="nav-links">
      <a href="team.html" class="active">TEAM</a>
      <a href="workout.html">WORKOUTS</a>
      <a href="index.html" class="logout" onclick="localStorage.removeItem('user')">EXIT</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>SQUAD STATUS</h1>
      <p>Today's Check-ins</p>
    </header>

    <div class="add-member-form" style="display: none;">
      <input type="text" id="newMemberName" placeholder="New member username">
      <button class="neon-btn-small" onclick="addMember()">ADD</button>
    </div>

    <div class="status-card glass-panel">
      <div id="membersList" class="members-grid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div class="checkin-container">
      <button class="check-btn neon-btn-large" onclick="checkIn()">CHECK IN</button>
      <p id="statusText" class="status-text">Tap to Check In</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
