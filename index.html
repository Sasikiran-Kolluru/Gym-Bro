<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Bros - Enter the Arena</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <video autoplay muted loop id="bgvid" playsinline>
    <source src="bgvid.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="landing-container">
    <h1 class="glitch" data-text="GYM BROS">GYM BROS</h1>
    <p class="subtitle">ELEVATE YOUR GRIND</p>
    <button class="neon-btn" onclick="openLogin()">ENTER</button>
  </div>

  <div id="loginPanel" class="glass-panel hidden">
    <div class="panel-header">
      <h2>AUTHENTICATION</h2>
      <button class="close-btn" onclick="closeLogin()">×</button>
    </div>
    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Enter Username" autocomplete="off">
      <input type="password" id="passwordInput" placeholder="Enter Password" autocomplete="off">
    </div>
    <button class="neon-btn solid" onclick="handleLogin()">LOGIN</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
